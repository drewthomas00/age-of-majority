name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 is the floor declared in engines; 24 is the active LTS; 26 is current.
        node: ['18', '20', '22', '24', '26']
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  # A birthday is a calendar date, and a library that only passes on a UTC
  # machine has not been tested. Prove the suite does not quietly depend on
  # the runner's own clock.
  test-non-utc:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: ['Pacific/Auckland', 'America/Los_Angeles']
    name: node 22 (TZ=${{ matrix.tz }})
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
